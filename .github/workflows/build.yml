name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create /tmp/tmpapp --project-name geenena --org com.geenena --platforms android
            cp -r /tmp/tmpapp/android ./android
          fi

      - name: Patch AndroidManifest
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          intent = '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>'
          if 'android:scheme="https"' not in s:
              if '</queries>' in s:
                  s = s.replace('</queries>', intent + '</queries>', 1)
              else:
                  s = s.replace('<application', '<queries>' + intent + '</queries>\n    <application', 1)
              open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: geenena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
